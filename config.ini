# OVERLAP RULES #
# rule_i_j = policy for mode (i) vs mode (j), where i,j are 1‑based indices
# Full: spheres overlap completely
# Half: spheres overlap partially
# None: spheres do not overlap
# NoTouch: spheres do not touch at all
# If a rule is not specified, it defaults to None.
